<text x="70.0" y="1880.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="400" fill="#8E8E96" text-anchor="start" xml:space="preserve">episode’s 5 other objects and the key’s room against the 5 other rooms, 200 test episodes per bar.</text>
