<text x="70.0" y="1724.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="400" fill="#8E8E96" text-anchor="start" xml:space="preserve">Untrained models, no adapter: the crumbs are the writer’s own keys and values in every layer at its own positions. Answer</text>
